name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: default
  XLAYER_RPC_URL: https://rpc.xlayer.tech

jobs:
  unit:
    name: Unit + invariant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge --version
      - run: forge test --match-path "test/unit/*" -vvv

  sizes:
    name: Contract sizes (EIP-170 / EIP-3860)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Build exactly what gets deployed and report sizes
        run: forge build --sizes --json --skip test > sizes.json || true
      - name: Fail if any runtime > 24,576 B or initcode > 49,152 B
        run: python3 script/ci/check_sizes.py sizes.json

  fork:
    name: Fork tests (X Layer mainnet) + gas report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge test --match-path "test/fork/*" -vvv --gas-report

  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.10.4
      - name: Run Slither (its exit code only says findings exist; the gate below decides)
        run: rm -f slither.json slither.db.json; slither . --filter-paths "lib/|test/|script/|src/libraries/uniswap/" --exclude-dependencies --json slither.json || true
      - name: Fail on any finding not in the triaged baseline
        run: python3 script/ci/slither_gate.py slither.json script/ci/slither_baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: slither.json

  deploy-dry-run:
    name: Deploy dry run (fork, no broadcast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Simulate Deploy.s.sol against a mainnet fork with a throwaway key
        env:
          # anvil's well-known test key #0; never funded on mainnet, simulation only
          PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          # prod Deploy requires contract fee recipients: stand-ins are the TapeOut Safe and the Container opener (fork only)
          CIRC_PROTOCOL: "0xB3D85b42A045c1A88D800CAD0F55d2566a4D3138"
          CIRC_SINK: "0x536adD8F30f03b69f6fbF29d425A816A0dC50106"
        run: forge script script/Deploy.s.sol:Deploy --fork-url "$XLAYER_RPC_URL" -vvv

  gate2:
    name: GATE 2 dry run (anvil fork of X Layer mainnet)
    if: github.event_name == 'workflow_dispatch'
    needs: build-artifacts
    runs-on: ubuntu-latest
    env:
      ANVIL: http://127.0.0.1:8545
      HOLDER: "0x934d315C0a9C0866D393B722C1805F2B6b20b816"
      # prod Deploy requires contract fee recipients: TapeOut Safe + Container opener as fork-only stand-ins
      CIRC_PROTOCOL: "0xB3D85b42A045c1A88D800CAD0F55d2566a4D3138"
      CIRC_SINK: "0x536adD8F30f03b69f6fbF29d425A816A0dC50106"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Same bytes as the deploy artifact
        run: forge build --skip test
      - uses: actions/download-artifact@v4
        with:
          name: forge-build
          path: deploy-artifact
      - name: Prove this build is byte-identical to what gets deployed
        run: python3 script/ci/same_bytes.py out deploy-artifact/out
      - name: Start anvil fork (chain id stays 196)
        run: |
          anvil --fork-url "$XLAYER_RPC_URL" --port 8545 --auto-impersonate --silent > anvil.log 2>&1 &
          for i in $(seq 1 60); do cast block-number --rpc-url $ANVIL >/dev/null 2>&1 && break; sleep 2; done
          echo "chain id $(cast chain-id --rpc-url $ANVIL), fork block $(cast block-number --rpc-url $ANVIL)"
      - name: Fresh throwaway fork keys (never used on mainnet)
        run: |
          DK=0x$(openssl rand -hex 32); BK=0x$(openssl rand -hex 32)
          echo "::add-mask::$DK"; echo "::add-mask::$BK"
          for A in $(cast wallet address $DK) $(cast wallet address $BK) $HOLDER; do
            cast rpc anvil_setBalance $A 0x3635C9ADC5DEA00000 --rpc-url $ANVIL >/dev/null   # 1000 OKB
          done
          echo "PRIVATE_KEY=$DK" >> $GITHUB_ENV; echo "BUYER_KEY=$BK" >> $GITHUB_ENV
          echo "deployer $(cast wallet address $DK)"; echo "buyer $(cast wallet address $BK)"
      - name: 1) Dry run - live curve constants for approval
        run: |
          forge script script/Deploy.s.sol:Deploy --rpc-url $ANVIL -vv | tee dry.txt
          W=$(grep -oE 'LIVE_WOKB_VQUOTE0 [0-9]+' dry.txt | tail -1 | awk '{print $2}')
          B=$(grep -oE 'LIVE_BEM_VQUOTE0 [0-9]+' dry.txt | tail -1 | awk '{print $2}')
          test -n "$W" && test -n "$B"
          # Fork-only: the dry-run values stand in for the owner's approval. Mainnet needs the owner's own values.
          echo "APPROVED_WOKB_VQUOTE0=$W" >> $GITHUB_ENV; echo "APPROVED_BEM_VQUOTE0=$B" >> $GITHUB_ENV
      - name: 2) Deploy (broadcast to the anvil fork)
        run: |
          forge script script/Deploy.s.sol:Deploy --rpc-url $ANVIL --broadcast -vv | tee deploy.txt
          PAD=$(grep -oE 'CurvePad +0x[0-9a-fA-F]{40}' deploy.txt | tail -1 | awk '{print $2}')
          test -n "$PAD"; echo "CIRC_PAD=$PAD" >> $GITHUB_ENV
      - name: 3) Launch as the Nandout holder
        run: |
          forge script script/Gate2Sample.s.sol --sig "launch()" --rpc-url $ANVIL --broadcast --unlocked --sender $HOLDER -vv | tee launch.txt
          TOKEN=$(grep -oE 'TOKEN 0x[0-9a-fA-F]{40}' launch.txt | tail -1 | awk '{print $2}')
          test -n "$TOKEN"; echo "CIRC_TOKEN=$TOKEN" >> $GITHUB_ENV
          cast rpc anvil_mine 0x20 --rpc-url $ANVIL >/dev/null   # past GUARD_BLOCKS (30)
      - name: 4) Fill -> Complete -> graduate -> trade via Universal Router -> collect
        run: |
          forge script script/Gate2Sample.s.sol --sig "finish()" --rpc-url $ANVIL --broadcast -vv | tee finish.txt
          grep -q "GATE2 SAMPLE RUN OK" finish.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate2-run
          path: |
            dry.txt
            deploy.txt
            launch.txt
            finish.txt
            broadcast/

  build-artifacts:
    name: Build artifacts for the local deploy (forge 1.7.1, the bytes that get deployed)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge build --skip test
      - uses: actions/upload-artifact@v4
        with:
          name: forge-build
          path: |
            out/
            cache/

  e2e-fork:
    name: CIRC-TEST E2E rehearsal (anvil fork, same driver as the live run)
    if: github.event_name == 'workflow_dispatch'
    needs: build-artifacts
    runs-on: ubuntu-latest
    env:
      E2E_RPC: http://127.0.0.1:8545
      E2E_FORK: "1"
      MAIN_WALLET: "0x000000000000000000000000000000000000c0DE"
      CIRC_PROTOCOL: "0x000000000000000000000000000000000000dEaD"
      CIRC_SINK: "0x000000000000000000000000000000000000bEEF"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge build --skip test
      - uses: actions/download-artifact@v4
        with:
          name: forge-build
          path: deploy-artifact
      - name: Prove this build is byte-identical to what gets deployed
        run: python3 script/ci/same_bytes.py out deploy-artifact/out
      - name: Start anvil fork (chain id stays 196)
        run: |
          anvil --fork-url "$XLAYER_RPC_URL" --port 8545 --auto-impersonate --silent > anvil.log 2>&1 &
          for i in $(seq 1 60); do cast block-number --rpc-url $E2E_RPC >/dev/null 2>&1 && break; sleep 2; done
          echo "chain id $(cast chain-id --rpc-url $E2E_RPC), fork block $(cast block-number --rpc-url $E2E_RPC)"
      - name: Throwaway fork keys, funded like the live run (deployer 0.01, keeper 0.05, buyer 0.2 OKB)
        run: |
          for n in DEPLOYER KEEPER BUYER; do K=0x$(openssl rand -hex 32); echo "::add-mask::$K"; echo "${n}_KEY=$K" >> $GITHUB_ENV; done
      - name: Fund
        run: |
          cast rpc anvil_setBalance $(cast wallet address $DEPLOYER_KEY) $(cast to-hex 10000000000000000) --rpc-url $E2E_RPC
          cast rpc anvil_setBalance $(cast wallet address $KEEPER_KEY) $(cast to-hex 50000000000000000) --rpc-url $E2E_RPC
          cast rpc anvil_setBalance $(cast wallet address $BUYER_KEY) $(cast to-hex 200000000000000000) --rpc-url $E2E_RPC
      - name: Run the E2E driver
        run: python3 -I script/e2e/e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-fork-results
          path: |
            docs/E2E_RESULTS.md
            broadcast/
