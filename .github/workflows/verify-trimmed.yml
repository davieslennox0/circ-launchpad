name: OKLink input check

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Extra standard-JSON input to test (repo path), optional
        required: false
        default: ""

jobs:
  compare:
    name: Recompile CurvePad input vs deployed bytecode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: solc 0.8.24 (static)
        run: |
          curl -sL -o solc https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux && chmod +x solc
          ./solc --version | tail -1
      - name: Full input of the production CurvePad
        run: python3 script/ci/compare_runtime.py ./solc docs/verification/CurvePad-v3.standard-input.json 0x4b9eb3Ee0a25FFE62e159080f392551a99493cC7 https://rpc.xlayer.tech
      - name: Candidate input (optional)
        if: ${{ inputs.candidate != '' }}
        run: python3 script/ci/compare_runtime.py ./solc "${{ inputs.candidate }}" 0x4b9eb3Ee0a25FFE62e159080f392551a99493cC7 https://rpc.xlayer.tech
